# Local development now runs natively on the host (see Procfile + scripts/setup.sh).
# The only piece left in Docker is DynamoDB Local — KMS / SSM / Lambda / API Gateway
# are bypassed in DEV_MODE (MockEncryptor + EnvResolver, backend served via cmd/server).
services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: gophdrive-dynamodb
    command: -jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data
    ports:
      - "8000:8000"
    user: root
    working_dir: /home/dynamodblocal
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    restart: unless-stopped

volumes:
  dynamodb-data:
