name: CI

on:
  push:
    branches:
      - main
      # Renovate uses automergeType: 'branch' + platformAutomerge, so on the happy
      # path it can merge a branch without ever opening a PR — and then no
      # `pull_request` event fires and the deps-sync drift check never gates the
      # update. Triggering on renovate/** makes the check run regardless of whether
      # a PR exists. Cost: when Renovate does open a PR, both events fire and CI
      # runs twice on that branch. Renovate is scheduled weekly, so that is cheap.
      - 'renovate/**'
  pull_request:

jobs:
  backend-core:
    name: Backend & Core (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.tool-versions'
          cache-dependency-path: |
            backend/go.sum
            core/go.sum

      - name: Check Backend (fmt, vet, test)
        working-directory: ./backend
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi
          go vet ./...
          go test ./...

      - name: Check Core (fmt, vet, test)
        working-directory: ./core
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi
          go vet ./...
          go test ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Prettier
        working-directory: ./frontend
        run: npx prettier --check .

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Run Tests
        working-directory: ./frontend
        run: npm run test

  deps-sync:
    name: Dependency Sync (go.mod / lockfiles)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: '.tool-versions'
          cache-dependency-path: |
            backend/go.sum
            core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.tool-versions'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            infra/package-lock.json

      - name: Check dependency manifests are in sync
        env:
          DEPS_SYNC_NO_MISE: '1'
        run: ./scripts/deps-sync.sh --check

